<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>

    <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>

    <header class="topbar">
        <h1>Attendance Dashboard</h1>
        <div class="topbar-right">
            <span id="teacherName"></span>
            <button id="logoutBtn" class="btn-outline">Logout</button>
        </div>
    </header>

    <main>

        <section class="card">
            <h2>Add Student</h2>
            <form id="studentForm" class="inline-form">
                <input type="text" id="s-name" placeholder="Name" required>
                <input type="text" id="s-roll" placeholder="Roll Number" required>
                <input type="text" id="s-section" placeholder="Section" required>
                <input type="email" id="s-email" placeholder="Email (optional)">
                <input type="text" id="s-phone" placeholder="Phone (optional)">
                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="card">
            <h2>Students</h2>
            <div class="table-wrap">
                <table id="studentsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll No</th>
                            <th>Section</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="studentsEmpty" class="empty-msg" style="display:none;">No students added yet.</p>
            </div>
        </section>

        <section class="card">
            <h2>Mark Attendance</h2>
            <form id="attendanceForm" class="inline-form">
                <select id="a-student" required>
                    <option value="" disabled selected>Select Student</option>
                </select>
                <select id="a-status" required>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Leave">Leave</option>
                </select>
                <button type="submit">Mark Attendance</button>
            </form>
        </section>

        <section class="card">
            <h2>Attendance Records</h2>
            <div class="table-wrap">
                <table id="attendanceTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student</th>
                            <th>Roll No</th>
                            <th>Status</th>
                            <th>Marked By</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="attendanceEmpty" class="empty-msg" style="display:none;">No attendance records yet.</p>
            </div>
        </section>

    </main>

    <script src="./js/dashboard.js"></script>

</body>

</html>
