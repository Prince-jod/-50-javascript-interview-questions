<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
</head>
<body>

<h2>Teacher Login</h2>

<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<script src="login.js"></script>

</body>
</html>
