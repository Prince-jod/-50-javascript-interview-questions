<!DOCTYPE html>
<html>
<head>
    <title>Teacher Signup</title>
</head>
<body>

<h2>Teacher Signup</h2>

<form id="signupForm">

    <input
        type="text"
        id="name"
        placeholder="Enter Name"
        required
    >

    <br><br>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
    >

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<script src="./js/signup.js"></script>

</body>
</html>
