<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Tracker Dashboard</title>

    <link
        rel="stylesheet"
        href="./css/dashboard.css"
    >

</head>

<body>

    <!-- Topbar -->
    <header class="topbar">

        <h1>Expense Tracker</h1>

        <div class="topbar-right">

            <span id="userName"></span>

            <!-- Buy Premium Button -->
            <button
                id="premiumBtn"
                class="btn-premium"
            >
                Buy Premium Membership
            </button>

            <!-- Leaderboard -->
            <button
                id="leaderboardBtn"
                class="btn-outline"
                style="display: none;"
            >
                🏆 Leaderboard
            </button>

            <!-- Logout -->
            <button
                id="logoutBtn"
                class="btn-outline"
            >
                Logout
            </button>

        </div>

    </header>


    <main>

        <!-- Premium User Message -->
        <div
            id="premiumMessage"
            class="premium-message"
            style="display: none;"
        >
            🎉 You are a premium user now
        </div>


        <!-- Total Spent -->
        <section class="card summary-card">

            <div>

                <p class="summary-label">
                    Total Spent
                </p>

                <p
                    class="summary-value"
                    id="totalAmount"
                >
                    ₹0.00
                </p>

            </div>

        </section>


        <!-- Add / Edit Expense -->
        <section class="card">

            <h2 id="expenseFormTitle">
                Add Expense
            </h2>


            <form
                id="expenseForm"
                class="inline-form"
            >

                <input
                    type="hidden"
                    id="e-id"
                >


                <!-- Name -->
                <input
                    type="text"
                    id="e-name"
                    placeholder="Name"
                    required
                >


                <!-- Title -->
                <input
                    type="text"
                    id="e-title"
                    placeholder="Title"
                    required
                >


                <!-- Amount -->
                <input
                    type="number"
                    id="e-amount"
                    placeholder="Amount"
                    min="0"
                    step="0.01"
                    required
                >


                <!-- Category -->
                <select
                    id="e-category"
                    required
                >

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Health">
                        Health
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Date -->
                <input
                    type="date"
                    id="e-date"
                    required
                >


                <!-- Add / Update -->
                <button
                    type="submit"
                    id="expenseSubmitBtn"
                >
                    Add Expense
                </button>


                <!-- Cancel -->
                <button
                    type="button"
                    id="expenseCancelBtn"
                    class="btn-outline"
                    style="display: none;"
                >
                    Cancel
                </button>

            </form>

        </section>


        <!-- Expenses -->
        <section class="card">

            <h2>
                Expenses
            </h2>


            <div class="table-wrap">

                <table id="expensesTable">

                    <thead>

                        <tr>

                            <th>Name</th>

                            <th>Date</th>

                            <th>Title</th>

                            <th>Category</th>

                            <th>Amount</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody></tbody>

                </table>


                <p
                    id="expensesEmpty"
                    class="empty-msg"
                    style="display: none;"
                >
                    No expenses added yet.
                </p>

            </div>

        </section>


        <!-- Leaderboard -->
        <section
            id="leaderboardSection"
            class="card"
            style="display: none;"
        >

            <h2>
                🏆 Leaderboard
            </h2>


            <div class="table-wrap">

                <table id="leaderboardTable">

                    <thead>

                        <tr>

                            <th>Rank</th>

                            <th>User</th>

                            <th>Total Expense</th>

                        </tr>

                    </thead>


                    <tbody></tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- Cashfree SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <!-- Dashboard JavaScript -->
    <script src="./js/dashboard.js"></script>

</body>

</html>
```
