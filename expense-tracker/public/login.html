<form id="loginForm">

    <h2>Login</h2>

    <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
    >

    <button type="submit">
        Login
    </button>

    <button type="button" id="forgotPasswordBtn">
        Forgot Password?
    </button>

    <p>
        Don't have an account?
        <a href="signup.html">Register</a>
    </p>

</form>


<!-- Separate form OUTSIDE loginForm -->
<form id="forgotPasswordForm" style="display: none;">

    <h3>Forgot Password</h3>

    <input
        type="email"
        id="forgotEmail"
        placeholder="Enter your email"
        required
    >

    <button type="submit">
        Send Email
    </button>

</form>
