<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Attendance Taker</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div class="container">

    <h1>Attendance Taker</h1>

    <!-- Search Attendance By Date -->
    <div class="search-box">

      <input
        type="date"
        id="attendanceDate"
      >

      <button id="searchBtn">
        Search
      </button>

    </div>

    <!-- Message -->
    <div id="message"></div>


    <!-- Student Attendance Table -->
    <table id="attendanceTable">

      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Present</th>
          <th>Absent</th>
        </tr>
      </thead>

      <tbody id="studentList">
        <!-- Students will be added by JavaScript -->
      </tbody>

    </table>


    <!-- Mark Attendance -->
    <button id="markAttendanceBtn">
      Mark Attendance
    </button>


    <!-- Fetch Attendance Report -->
    <button id="fetchReportBtn">
      Fetch Attendance
    </button>


    <!-- Attendance Report -->
    <div id="reportSection">

      <h2>Attendance Report</h2>

      <table id="reportTable">

        <thead>
          <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Present</th>
            <th>Total</th>
            <th>Percentage</th>
          </tr>
        </thead>

        <tbody id="reportList">
          <!-- Attendance report will be added by JavaScript -->
        </tbody>

      </table>

    </div>

  </div>


  <!-- JavaScript -->
  <script src="/js/attendance.js"></script>

</body>

</html>
