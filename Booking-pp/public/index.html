<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User CRUD App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>User Registration</h1>

        <form id="userForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Enter Phone Number"
                required
            >

            <button type="submit">
                Add User
            </button>

        </form>

        <hr>

        <h2>Users</h2>

        <table>

            <thead>

                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="userList">

            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
